<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>كود دخولك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
  :root{
    --ink:#12181f;
    --surface:#1b2430;
    --surface-2:#212c3a;
    --gold:#e3a548;
    --gold-dim:#a97a34;
    --text:#f3efe6;
    --muted:#8b96a5;
    --success:#5fbf8f;
    --error:#e2705f;
    --radius:18px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, #1c2836 0%, var(--ink) 55%);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .wrap{
    width:100%;
    max-width:400px;
  }

  .eyebrow{
    text-align:center;
    color:var(--gold);
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.12em;
    margin-bottom:8px;
  }

  h1{
    text-align:center;
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:26px;
    margin:0 0 28px;
    color:var(--text);
  }

  /* ---------- شاشة إدخال الكود ---------- */
  .panel{
    background:var(--surface);
    border-radius:var(--radius);
    padding:28px 24px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.6);
  }

  label{
    display:block;
    font-size:14px;
    color:var(--muted);
    margin-bottom:10px;
  }

  input[type="text"]{
    width:100%;
    background:var(--surface-2);
    border:1.5px solid transparent;
    border-radius:12px;
    padding:15px 16px;
    font-family:'Tajawal', sans-serif;
    font-size:17px;
    color:var(--text);
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="text"]::placeholder{color:var(--muted);}
  input[type="text"]:focus{border-color:var(--gold);}
  input[type="text"]:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .hint{
    font-size:13px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.6;
  }

  button{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--gold);
    color:#241a08;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  button:hover{background:#edb45c;}
  button:active{transform:scale(.98);}
  button:focus-visible{outline:2px solid var(--text); outline-offset:2px;}
  button:disabled{opacity:.6; cursor:default;}

  .msg{
    margin-top:16px;
    font-size:14px;
    text-align:center;
    line-height:1.6;
    display:none;
  }
  .msg.show{display:block;}
  .msg.error{color:var(--error);}
  .msg.loading{color:var(--muted);}

  /* ---------- التذكرة (النتيجة) ---------- */
  .ticket{
    display:none;
    background:var(--surface);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.6);
    opacity:0;
    transform:translateY(10px) scale(.98);
  }
  .ticket.show{
    display:block;
    animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .ticket.show{animation:none; opacity:1; transform:none;}
  }

  .ticket-qr{
    background:var(--text);
    padding:28px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ticket-qr img{display:block; border-radius:6px;}

  /* الخط المنقط + النقط الدائرية اللي بتديها شكل تذكرة حقيقية */
  .perforation{
    position:relative;
    height:0;
    border-top:2px dashed var(--surface-2);
    margin:0 0;
  }
  .perforation::before,
  .perforation::after{
    content:"";
    position:absolute;
    top:-11px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--ink);
  }
  .perforation::before{right:-11px;}
  .perforation::after{left:-11px;}

  .ticket-info{
    padding:22px 24px 26px;
    text-align:center;
  }
  .ticket-label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.1em;
    margin-bottom:6px;
  }
  .ticket-name{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--text);
    margin-bottom:16px;
  }
  .ticket-code-label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.1em;
    margin-bottom:6px;
  }
  .ticket-code{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:24px;
    letter-spacing:.08em;
    color:var(--gold);
  }

  .download-btn{
    display:none;
    width:100%;
    margin-top:18px;
    padding:14px;
    border:1.5px solid var(--gold);
    border-radius:12px;
    background:transparent;
    color:var(--gold);
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .download-btn:hover{background:var(--gold); color:#241a08;}
  .download-btn:disabled{opacity:.6; cursor:default;}
  .download-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .again{
    display:block;
    text-align:center;
    margin-top:18px;
    color:var(--muted);
    font-size:14px;
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    width:100%;
    font-family:'Tajawal', sans-serif;
  }

  .captcha-wrap{
    display:flex;
    justify-content:center;
    margin-top:18px;
  }
  @media (max-width:400px){
    .captcha-wrap{
      transform:scale(.85);
      transform-origin:center top;
      margin-bottom:-12px;
    }
  }

  .setup-notice{
    display:none;
    margin-top:16px;
    font-size:12px;
    color:var(--error);
    background:rgba(226,112,95,.1);
    border:1px solid rgba(226,112,95,.3);
    border-radius:10px;
    padding:12px;
    line-height:1.7;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">كارت الحضور</div>
  <h1>هات الرقم التعريفي بتاعك</h1>

  <form class="panel" id="lookupForm">
    <label for="query">الكود بتاعك أو رقم تليفونك</label>
    <input type="text" id="query" inputmode="text" autocomplete="off" placeholder="مثال: 1024 أو 01012345678" required>
    <div class="hint">لو حافظ كودك اكتبه زي ما هو. لو نسيته، اكتب رقم التليفون اللي متسجل بيه وهنجيبلك كودك.</div>
    <div class="captcha-wrap">
      <div class="g-recaptcha" id="recaptchaBox" data-sitekey="6LdQv5UtAAAAACWGFTQkRTMswoQZi6vdtsk0a1Sw" data-theme="dark"></div>
    </div>
    <button type="submit" id="submitBtn">طلّع الكود بتاعي</button>
    <div class="msg" id="msg"></div>
    <div class="setup-notice" id="setupNotice">
      ⚠️ لسه محطتش رابط الـ Apps Script بتاعك. افتح ملف الصفحة، ودور على <code>API_URL</code> في أول &lt;script&gt;، واستبدله برابط الـ Web app بعد ما تعمله Deploy.
    </div>
  </form>

  <div class="ticket" id="ticket">
    <div class="ticket-qr"><div id="qrcode"></div></div>
    <div class="perforation"></div>
    <div class="ticket-info">
      <div class="ticket-label">اسم الطالب</div>
      <div class="ticket-name" id="ticketName">—</div>
      <div class="ticket-code-label">الرقم التعريفي</div>
      <div class="ticket-code" id="ticketCode">—</div>
    </div>
  </div>
  <button class="download-btn" id="downloadBtn">⬇ نزّل البطاقة كصورة</button>
  <button class="again" id="againBtn" style="display:none;">دوّر بكود تاني</button>
</div>

  const logoImage = new Image();
  const logoReady = new Promise((resolve) => {
    logoImage.onload = () => resolve(true);
    logoImage.onerror = () => resolve(false);
  });
  logoImage.src = LOGO_DATA_URL;

  // معرّف عشوائي بيتولّد مرة واحدة ويتخزن في المتصفح، بيتبعت مع كل طلب
  // عشان السيرفر يقدر يحسب عدد المحاولات الغلط ويوقف التخمين المتكرر.
  function getDeviceId(){
    try {
      let id = localStorage.getItem('studentLookupDeviceId');
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : ('id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
        localStorage.setItem('studentLookupDeviceId', id);
      }
      return id;
    } catch (err) {
      return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    }
  }
  const DEVICE_ID = getDeviceId();

  const form = document.getElementById('lookupForm');
  const input = document.getElementById('query');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  const setupNotice = document.getElementById('setupNotice');
  const ticket = document.getElementById('ticket');
  const ticketName = document.getElementById('ticketName');
  const ticketCode = document.getElementById('ticketCode');
  const againBtn = document.getElementById('againBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const qrcodeEl = document.getElementById('qrcode');

  if (API_URL.indexOf('PASTE_YOUR') > -1) {
    setupNotice.style.display = 'block';
  }

  function setMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg show' + (type ? ' ' + type : '');
  }
  function clearMsg(){
    msg.className = 'msg';
    msg.textContent = '';
  }

  function showTicket(name, code){
    form.style.display = 'none';
    ticketName.textContent = name;
    ticketCode.textContent = code;
    qrcodeEl.innerHTML = '';
    new QRCode(qrcodeEl, {
      text: code,
      width: 200,
      height: 200,
      colorDark: '#12181f',
      colorLight: '#f3efe6',
      correctLevel: QRCode.CorrectLevel.M
    });
    ticket.classList.add('show');
    againBtn.style.display = 'block';
    downloadBtn.style.display = 'block';
  }

  function resetForm(){
    ticket.classList.remove('show');
    setTimeout(() => { ticket.style.display = 'none'; }, 200);
    againBtn.style.display = 'none';
    downloadBtn.style.display = 'none';
    form.style.display = 'block';
    input.value = '';
    clearMsg();
    input.focus();
  }
  againBtn.addEventListener('click', resetForm);

  // بنرسم البطاقة يدويًا على Canvas 2D بدل ما ناخد "screenshot" للـ HTML.
  // السبب: مكتبات تصوير الـ HTML (زي html2canvas) مش بتعرف تشكّل الحروف
  // العربية صح (بترجع الحروف منفصلة ومقلوبة)، ومش دايمًا بتقرأ ألوان
  // CSS variables صح (عشان كده الصورة طلعت رمادي باهت). الرسم اليدوي بيستخدم
  // محرك الخطوط الأصلي بتاع المتصفح، فبيطلع بالظبط زي ما هو ظاهر على الشاشة.
  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function getQrSource(){
    return qrcodeEl.querySelector('canvas') || qrcodeEl.querySelector('img');
  }

  async function buildTicketCanvas(){
    const [, , , , , logoLoaded] = await Promise.all([
      document.fonts.load('700 13px Cairo'),
      document.fonts.load('700 19px Cairo'),
      document.fonts.load('400 12px Tajawal'),
      document.fonts.load('700 26px "JetBrains Mono"'),
      document.fonts.ready,
      logoReady
    ]);

    const W = 440, pad = 28, qrSize = 200, headerH = 56, radius = 22;
    const qrSectionH = qrSize + pad * 2;
    const infoH = 150;
    const footerH = logoLoaded ? 96 : 0;
    const H = headerH + qrSectionH + infoH + footerH;
    const scale = 3; // دقة أعلى من شاشة الموبايل العادية عشان الصورة تطلع حادة

    const canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';

    roundRectPath(ctx, 0, 0, W, H, radius);
    ctx.clip();

    // الهيدر
    ctx.fillStyle = '#1b2430';
    ctx.fillRect(0, 0, W, headerH);
    ctx.fillStyle = '#e3a548';
    ctx.font = '700 13px Cairo, sans-serif';
    ctx.fillText('كارت الحضور', W / 2, headerH / 2 + 5);

    // مكان الـ QR (خلفية فاتحة زي الأصل)
    ctx.fillStyle = '#f3efe6';
    ctx.fillRect(0, headerH, W, qrSectionH);
    const qrSource = getQrSource();
    if (qrSource) ctx.drawImage(qrSource, (W - qrSize) / 2, headerH + pad, qrSize, qrSize);

    // قسم البيانات (وامتداده لمكان الختم تحت)
    const infoY = headerH + qrSectionH;
    ctx.fillStyle = '#1b2430';
    ctx.fillRect(0, infoY, W, infoH + footerH);

    // خط التذكرة المنقط والنقط الدائرية
    ctx.strokeStyle = '#212c3a';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(0, infoY);
    ctx.lineTo(W, infoY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#12181f';
    ctx.beginPath(); ctx.arc(0, infoY, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W, infoY, 11, 0, Math.PI * 2); ctx.fill();

    // النصوص
    let y = infoY + 34;
    ctx.fillStyle = '#8b96a5';
    ctx.font = '400 12px Tajawal, sans-serif';
    ctx.fillText('اسم الطالب', W / 2, y);

    y += 26;
    ctx.fillStyle = '#f3efe6';
    ctx.font = '700 19px Cairo, sans-serif';
    ctx.fillText(ticketName.textContent, W / 2, y);

    y += 32;
    ctx.fillStyle = '#8b96a5';
    ctx.font = '400 12px Tajawal, sans-serif';
    ctx.fillText('كود الدخول', W / 2, y);

    y += 30;
    ctx.fillStyle = '#e3a548';
    ctx.font = '700 26px "JetBrains Mono", monospace';
    ctx.fillText(ticketCode.textContent, W / 2, y);

    // ختم اللوجو تحت — بيبان بس لو الصورة اتحمّلت صح
    if (logoLoaded) {
      const badgeY = infoY + infoH + footerH / 2;
      const outerR = 34, innerR = 30;
      ctx.fillStyle = '#212c3a';
      ctx.beginPath(); ctx.arc(W / 2, badgeY, outerR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#e3a548';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(W / 2, badgeY, outerR, 0, Math.PI * 2); ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(W / 2, badgeY, innerR, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(logoImage, W / 2 - innerR, badgeY - innerR, innerR * 2, innerR * 2);
      ctx.restore();
    }

    return canvas;
  }

  downloadBtn.addEventListener('click', async () => {
    downloadBtn.disabled = true;
    const originalLabel = downloadBtn.textContent;
    downloadBtn.textContent = 'بتتحمّل...';
    try {
      const canvas = await buildTicketCanvas();
      const link = document.createElement('a');
      link.download = 'كود-' + (ticketCode.textContent || 'الطالب') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (err) {
      setMsg('حصلت مشكلة وإحنا بنحمّل الصورة، جرب تاني.', 'error');
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = originalLabel;
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;

    if (API_URL.indexOf('PASTE_YOUR') > -1) {
      setMsg('الصفحة لسه مش متظبطة، كلم اللي مسؤول عن السنتر.', 'error');
      return;
    }

    const captchaToken = (typeof grecaptcha !== 'undefined') ? grecaptcha.getResponse() : '';
    if (!captchaToken) {
      setMsg('من فضلك اثبت إنك مش روبوت الأول (Captcha تحت).', 'error');
      return;
    }

    submitBtn.disabled = true;
    setMsg('بندور على بياناتك...', 'loading');
    ticket.style.display = 'none';

    try {
      const url = API_URL
        + '?action=lookup'
        + '&query=' + encodeURIComponent(query)
        + '&deviceId=' + encodeURIComponent(DEVICE_ID)
        + '&captchaToken=' + encodeURIComponent(captchaToken);
      const res = await fetch(url);
      const data = await res.json();

      if (data && data.found) {
        clearMsg();
        ticket.style.display = 'block';
        showTicket(data.name, data.code);
      } else if (data && data.locked) {
        setMsg('في محاولات غلط كتير من عندك. استنى شوية وجرب تاني.', 'error');
      } else if (data && data.captchaFailed) {
        const debugInfo = (data.debug && data.debug.length) ? (' [' + data.debug.join(', ') + ']') : '';
        setMsg('التحقق (Captcha) مضبوطش، جرب تاني.' + debugInfo, 'error');
      } else {
        setMsg('مفيش طالب بالكود أو الرقم ده، تأكد وجرب تاني.', 'error');
      }
    } catch (err) {
      setMsg('حصلت مشكلة في الاتصال، جرب تاني كمان شوية.', 'error');
    } finally {
      submitBtn.disabled = false;
      if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
    }
  });
</script>
